# ---------------------------------------------------------------------------
# Bendito Orgânico — vhost definitivo (HTTP -> HTTPS + PHP-FPM)
#
# Destino: /etc/nginx/sites-available/benditoorganico.com.br
# Link:    /etc/nginx/sites-enabled/benditoorganico.com.br
#
# ISOLAMENTO — por que os outros domínios da VPS não são afetados:
#   * nenhum "default_server" aqui, então quem já é o default continua sendo;
#   * server_name fecha só em benditoorganico.com.br e www;
#   * fastcgi_pass aponta para um socket EXCLUSIVO deste site
#     (/run/php/bendito-organico.sock), criado por um pool PHP-FPM próprio;
#   * arquivo novo em sites-available, nenhum arquivo existente é editado.
#
# Antes de recarregar o nginx, SEMPRE: sudo nginx -t
# ---------------------------------------------------------------------------

# --- HTTP: só ACME e redirecionamento --------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name benditoorganico.com.br www.benditoorganico.com.br;

    # Renovação do Let's Encrypt precisa continuar respondendo em texto claro.
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/benditoorganico.com.br/public;
    }

    location / {
        return 301 https://benditoorganico.com.br$request_uri;
    }
}

# --- HTTPS: www -> raiz ----------------------------------------------------
# Uma única URL canônica evita sessão duplicada e conteúdo repetido no Google.
server {
    # O parametro "http2" no listen funciona do nginx 1.9.5 ao atual. A forma
    # nova ("http2 on;") so existe a partir do 1.25.1 e faria o "nginx -t"
    # falhar no nginx que vem no Ubuntu 22.04 (1.18) e 24.04 (1.24). No nginx
    # 1.25.1+ esta forma segue valendo, apenas com um aviso de descontinuada.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.benditoorganico.com.br;

    ssl_certificate     /etc/letsencrypt/live/benditoorganico.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benditoorganico.com.br/privkey.pem;

    # Parametros TLS embutidos em vez de "include options-ssl-nginx.conf": esse
    # arquivo so aparece quando o plugin nginx do certbot e usado, e aqui a
    # emissao e por webroot justamente para o certbot nao editar vhost nenhum.
    #
    # O nome da zona de sessao ("bendito_ssl") e exclusivo deste site de
    # proposito: reaproveitar o nome de uma zona ja declarada por outro dominio
    # faria o nginx -t falhar por conflito.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bendito_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://benditoorganico.com.br$request_uri;
}

# --- HTTPS: a loja ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name benditoorganico.com.br;

    root /var/www/benditoorganico.com.br/public;
    index index.php;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/benditoorganico.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benditoorganico.com.br/privkey.pem;

    # Parametros TLS embutidos em vez de "include options-ssl-nginx.conf": esse
    # arquivo so aparece quando o plugin nginx do certbot e usado, e aqui a
    # emissao e por webroot justamente para o certbot nao editar vhost nenhum.
    #
    # O nome da zona de sessao ("bendito_ssl") e exclusivo deste site de
    # proposito: reaproveitar o nome de uma zona ja declarada por outro dominio
    # faria o nginx -t falhar por conflito.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bendito_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Foto de produto pode ter até 4 MB (StoreProductRequest); a folga cobre
    # o overhead do multipart. Precisa casar com o php.ini do pool.
    client_max_body_size 8m;

    # ---- Cabeçalhos de segurança ----
    # HSTS só depois que o HTTPS estiver comprovadamente estável — um
    # preload precipitado prende o domínio no navegador do cliente.
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Logs por domínio ----
    access_log /var/log/nginx/benditoorganico.access.log;
    error_log  /var/log/nginx/benditoorganico.error.log;

    # ---- Bloqueios (vêm ANTES das demais regras regex de propósito) ----
    # O nginx avalia location regex na ordem do arquivo e para na primeira que
    # casa. Se estas viessem depois, a regra de imagens poderia responder antes
    # e servir um arquivo que deveria estar bloqueado.
    #
    # O banco SQLite fica em /database, fora do docroot, então já é
    # inalcançável. Isto cobre qualquer .env, .git ou dump que acabe em
    # public/ por acidente.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(sqlite|sqlite3|db|sql|env|log|bak)$ {
        deny all;
    }

    # ---- Roteamento Laravel ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets do Vite têm hash no nome: podem ser cacheados para sempre.
    # Atenção: um add_header dentro de uma location DESCARTA todos os herdados
    # do server, então o nosniff precisa ser repetido aqui.
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imagens da marca e fotos enviadas pelo painel (public/storage).
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # Socket exclusivo deste site — não é o pool www compartilhado.
        fastcgi_pass unix:/run/php/bendito-organico.sock;

        fastcgi_param HTTP_PROXY "";

        # O Laravel confia nos proxies (bootstrap/app.php) e usa estes
        # cabeçalhos para gerar URL https — inclusive a de retorno do
        # Mercado Pago. Sem isso, links de pagamento saem em http.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        # Consulta ao gateway durante o checkout pode demorar.
        fastcgi_read_timeout 60s;
    }
}
