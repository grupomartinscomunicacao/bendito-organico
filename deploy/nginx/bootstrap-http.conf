# ---------------------------------------------------------------------------
# Bendito Orgânico — ETAPA 1 (temporária, só HTTP)
#
# Existe apenas para o certbot conseguir validar o domínio pelo webroot.
# Assim que o certificado for emitido, este arquivo é substituído pelo
# benditoorganico.com.br.conf definitivo.
#
# Destino: /etc/nginx/sites-available/benditoorganico.com.br
#
# Nada aqui usa "default_server" nem toca em nginx.conf: os outros domínios
# da VPS continuam sendo servidos exatamente como antes.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name benditoorganico.com.br www.benditoorganico.com.br;

    root /var/www/benditoorganico.com.br/public;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/benditoorganico.com.br/public;
    }

    location / {
        return 200 'Bendito Organico: aguardando certificado SSL.';
        add_header Content-Type text/plain;
    }
}
