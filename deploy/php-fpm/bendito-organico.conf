; ---------------------------------------------------------------------------
; Bendito Orgânico — pool PHP-FPM dedicado
;
; Destino: /etc/php/8.X/fpm/pool.d/bendito-organico.conf
;          (troque 8.X pela versão instalada — veja com: php -v)
;
; POR QUE UM POOL SÓ PARA ESTE SITE:
;   * roda como o usuário "bendito-organico", que não tem acesso aos arquivos dos
;     outros domínios — um problema aqui fica contido aqui;
;   * limites de memória e de processos são desta loja: um pico de tráfego
;     nela não consome os workers dos outros sites;
;   * o pool "www" original continua intacto, servindo quem já servia.
;
; Depois de copiar: sudo php-fpm8.X -t && sudo systemctl reload php8.X-fpm
; O reload é gracioso — os outros pools não derrubam conexões.
; ---------------------------------------------------------------------------

[bendito-organico]

user = bendito-organico
group = bendito-organico

listen = /run/php/bendito-organico.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic segura bem uma loja pequena sem manter processos ociosos à toa.
; Em VPS compartilhada com outros sites, comece baixo e suba se necessário.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Um worker travado (gateway fora do ar, por exemplo) é morto em vez de
; segurar um slot do pool para sempre.
request_terminate_timeout = 120s

; Erros do PHP vão para um log próprio, separado dos outros domínios.
php_admin_value[error_log] = /var/log/php-fpm-bendito-organico.log
php_admin_flag[log_errors] = on

; Nunca mostrar erro de PHP para o visitante em produção.
php_admin_flag[display_errors] = off

php_admin_value[memory_limit] = 256M

; Precisa acomodar a foto de produto de 4 MB + overhead do multipart,
; e casar com o client_max_body_size do nginx.
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 60

php_admin_value[date.timezone] = America/Sao_Paulo

; Sessão e cache do Laravel vivem no banco; o handler de arquivo do PHP
; não é usado, mas fica confinado mesmo assim.
php_admin_value[session.save_path] = /var/www/benditoorganico.com.br/storage/framework/sessions

; Confina a leitura do PHP à pasta do site. Impede que um script daqui leia
; /var/www de outro domínio. /etc/ssl/certs entra porque a chamada HTTPS ao
; Mercado Pago precisa do bundle de CA; sem ele o checkout falha no TLS.
;
; Se algo do site quebrar com "open_basedir restriction in effect", comente
; esta linha e recarregue o FPM — o isolamento principal continua sendo o
; usuário próprio do pool.
php_admin_value[open_basedir] = /var/www/benditoorganico.com.br:/tmp:/usr/share/php:/etc/ssl/certs:/dev/urandom
